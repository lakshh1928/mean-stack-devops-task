version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    volumes:
      - mongo-data:/data/db

  backend:
    image: l4ksh1928/ddbackend:latest
    restart: always
    depends_on:
      - mongodb
    environment:
      - DB_URL=mongodb://mongodb:27017/tutorials_db

  frontend:
    image: l4ksh1928/ddfrontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
